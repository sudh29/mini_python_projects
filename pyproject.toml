[project]
name = "mini-python-projects"
version = "0.1.0"
description = "A curated collection of modular Python mini-projects, games, utilities, data pipelines, and algorithms."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "greenlet[dashboard]>=3.0.0",
    "img2pdf>=0.5.1",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "pillow>=10.3.0",
    "pyarrow>=16.0.0",
    "pypdf>=4.2.0",
    "pytesseract>=0.3.10",
    "requests>=2.32.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "requests-mock>=1.12.1",
    "ruff>=0.9.0",
]
dashboard = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.0",
    "passlib>=1.7.4",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "node_modules",
    "dist",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests", "game/tic_tac_toe/tests"]
pythonpath = [".", "game/tic_tac_toe", "dashboard_prototype/backend"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
